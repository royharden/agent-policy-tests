<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Agent NOT-List Builder: turn an agent's NOT list into executable policy tests." />
    <title>Agent NOT-List Builder</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1b1f24;
        --muted: #57606a;
        --border: #d0d7de;
        --mock-bg: #fff8c5;
        --mock-fg: #4d2d00;
        --local-bg: #ddf4ff;
        --local-fg: #0a3069;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --fg: #e6edf3;
          --muted: #8d96a0;
          --border: #30363d;
          --mock-bg: #3b2e00;
          --mock-fg: #f8e3a1;
          --local-bg: #0c2d4a;
          --local-fg: #cae8ff;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
      }
      .app {
        max-width: 1200px;
        margin: 0 auto;
        padding: 16px;
      }
      .tagline,
      .pending,
      .app-footer {
        color: var(--muted);
      }
      .banner {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 12px;
        margin: 12px 0;
      }
      .banner-mock {
        background: var(--mock-bg);
        color: var(--mock-fg);
      }
      .banner-local {
        background: var(--local-bg);
        color: var(--local-fg);
      }
      .app-footer {
        border-top: 1px solid var(--border);
        margin-top: 24px;
        padding-top: 8px;
        font-size: 0.875rem;
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; scroll-padding-top: 20px; }
      .app-header { padding: 24px 0 12px; }
      h1 { font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1.12; letter-spacing: -0.035em; margin: 8px 0 16px; max-width: 900px; }
      h2 { font-size: 1.5rem; margin-top: 0; }
      h3 { margin-top: 24px; }
      .eyebrow { text-transform: uppercase; font-weight: 700; font-size: .75rem; letter-spacing: .12em; color: var(--muted); }
      .tagline { font-size: 1.125rem; }
      main > section { padding: 24px; border: 1px solid var(--border); border-radius: 12px; margin: 24px 0; min-width: 0; }
      .step-nav, .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
      .step-nav { border-block: 1px solid var(--border); padding: 16px 0; margin: 24px 0; }
      a { color: var(--local-fg); text-underline-offset: 3px; }
      .step-nav a { font-weight: 600; padding: 4px 0; }
      .field { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; min-width: 0; }
      .field > span { font-weight: 600; }
      .field-inline { flex-direction: row; align-items: center; flex-wrap: wrap; }
      .field-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 0 16px; }
      input, textarea, select, button { font: inherit; color: inherit; }
      input:not([type=checkbox]), textarea, select { border: 1px solid var(--border); background: var(--bg); border-radius: 6px; padding: 10px; max-width: 100%; min-width: 0; }
      input[type=checkbox] { width: 18px; height: 18px; flex-shrink: 0; }
      textarea { width: 100%; resize: vertical; }
      button { cursor: pointer; padding: 10px 16px; min-height: 44px; border: 1px solid var(--border); border-radius: 6px; background: var(--local-bg); color: var(--local-fg); font-weight: 600; overflow-wrap: anywhere; }
      button:disabled { cursor: default; opacity: .55; }
      :focus-visible { outline: 3px solid #218bff; outline-offset: 3px; }
      fieldset { min-width: 0; border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin: 20px 0; }
      legend { padding: 0 8px; font-weight: 700; }
      .prompt { margin-top: 4px; }
      .help, .hint, .storage-status { color: var(--muted); font-size: .9rem; }
      .notice, .warning, .error, .empty { padding: 12px 16px; border: 1px solid var(--border); border-radius: 6px; }
      .notice { background: var(--local-bg); color: var(--local-fg); }
      .warning, .error { background: var(--mock-bg); color: var(--mock-fg); }
      .error { border-left: 4px solid currentColor; }
      .empty { border-style: dashed; color: var(--muted); }
      .approval { border-top: 1px solid var(--border); padding: 16px 0; }
      .table-scroll { overflow-x: auto; margin: 16px 0; }
      table { border-collapse: collapse; width: 100%; font-size: .9rem; text-align: left; }
      th, td { padding: 12px; border-bottom: 1px solid var(--border); vertical-align: top; min-width: 130px; }
      th { font-weight: 600; }
      caption { text-align: left; color: var(--muted); margin-bottom: 12px; }
      pre, code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .85em; overflow-wrap: anywhere; }
      pre { white-space: pre-wrap; margin: 8px 0; max-width: 420px; min-width: 180px; }
      .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 12px; }
      .metrics > div { border: 1px solid var(--border); border-radius: 6px; padding: 12px; }
      dt { color: var(--muted); }
      dd { margin: 6px 0 0; font-weight: 600; }
      .hashes dd { overflow-wrap: anywhere; }
      details { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 16px; }
      summary { cursor: pointer; padding: 8px 0; font-weight: 600; }
      ul { padding-left: 20px; }
      @media (max-width: 640px) {
        .app { padding: 12px; }
        main > section { padding: 16px; }
        fieldset { padding: 12px; }
        .toolbar > button { flex: 1 1 170px; }
        .toolbar > .field { width: 100%; }
      }
      @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
